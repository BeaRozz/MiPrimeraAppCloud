# version: '3.8'

services:
  baseDeDatos:
    image: mariadb:latest
    container_name: base_de_datos
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mi_primera_db
      MYSQL_USER: my_user
      MYSQL_PASSWORD: user_password
    ports:
      - "3445:3306"
    volumes:
      - ./db_data:/var/lib/mysql
  
  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: apache_server
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html

#linux guarda sus datos en var
#el software en etc
#apache en var/html
#/usr/local/apache2/htdocs/
#./src:/usr/local/apache2/htdocs/ cambia la info del contenedor y la redirije a la carpeta src
#para el contenedor, estamos trabajando en el, estamos linkeando las carpetas
#contenedor: aplicación o servicio que tiene el código fuente de mi aplicación para lanzarla
#tiene un sistema operativo para apoyarse